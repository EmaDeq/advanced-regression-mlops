name: Rollback PROD - Approved Image

on:
  workflow_dispatch:
    inputs:
      target_manifest:
        description: 'Archived PROD record, e.g. releases/history/prod-20261022-initial.json'
        required: true
        type: string
      confirmation:
        description: 'Type ROLLBACK to redeploy the archived approved PROD image'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: render-prod-operations
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'ROLLBACK'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: prod
      url: https://advanced-regression-mlops-prod.onrender.com
    steps:
      - name: Checkout approved production records
        uses: actions/checkout@v5

      - name: Verify rollback target is a previously successful approved PROD release
        id: approved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_MANIFEST: ${{ inputs.target_manifest }}
        run: |
          set -euo pipefail
          [[ "$TARGET_MANIFEST" =~ ^releases/history/prod-[A-Za-z0-9_-]+\.json$ ]] || { echo 'Invalid archived PROD manifest path'; exit 1; }
          test -f "$TARGET_MANIFEST" || { echo 'Archived PROD manifest missing'; exit 1; }
          jq -e '.environment == "prod"' "$TARGET_MANIFEST" > /dev/null
          jq -e '.environment == "prod"' releases/prod.json > /dev/null
          image="$(jq -r '.image' "$TARGET_MANIFEST")"
          current="$(jq -r '.image' releases/prod.json)"
          version="$(jq -r '.model_version' "$TARGET_MANIFEST")"
          release_run="$(jq -r '.release_run_id' "$TARGET_MANIFEST")"
          dev_run="$(jq -r '.dev_deployment_run_id' "$TARGET_MANIFEST")"
          prod_run="$(jq -r '.prod_deployment_run_id' "$TARGET_MANIFEST")"
          regex='^ghcr\.io/emadeq/advanced-regression-mlops@sha256:[a-f0-9]{64}$'
          [[ "$image" =~ $regex && "$current" =~ $regex ]] || { echo 'Invalid registry/digest'; exit 1; }
          [[ "$image" != "$current" ]] || { echo 'Already on this image; a DIFFERENT newer release is needed to demonstrate rollback'; exit 1; }
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$release_run" =~ ^[0-9]+$ && "$dev_run" =~ ^[0-9]+$ && "$prod_run" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_run" \
            | jq -e '.conclusion == "success" and .name == "Release Candidate - Verified Docker" and .head_branch == "main"' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$dev_run" \
            | jq -e '.conclusion == "success" and .name == "Deploy DEV - Verified GHCR Digest" and .head_branch == "main"' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prod_run" \
            | jq -e '.conclusion == "success" and (.name == "Promote DEV-verified image to PROD" or .name == "Rollback PROD - Approved Image") and .head_branch == "main"' > /dev/null
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Approved rollback target: $image"

      - name: Confirm live PROD currently matches recorded PROD release
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          CURRENT_IMAGE: ${{ steps.approved.outputs.current }}
        run: |
          set -euo pipefail
          [[ -n "$RENDER_API_KEY" && "$RENDER_SERVICE_ID" =~ ^srv-[A-Za-z0-9]+$ ]] || { echo 'Missing PROD credentials'; exit 1; }
          base="https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" "$base" > service.json
          jq -e '.name == "advanced-regression-mlops-prod"' service.json > /dev/null
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" "$base/deploys?limit=30" > current-deploys.json
          live_ref="$(jq -r '[.[] | (.deploy // .) | select(.status == "live")] | sort_by(.createdAt) | last | (.image.ref // empty)' current-deploys.json)"
          live_sha="$(jq -r '[.[] | (.deploy // .) | select(.status == "live")] | sort_by(.createdAt) | last | (.image.sha // empty)' current-deploys.json)"
          [[ "$live_ref" == "$CURRENT_IMAGE" || "$live_sha" == "${CURRENT_IMAGE##*@}" ]] || {
            echo 'Live Render image differs from releases/prod.json (or no live deploy found). Stop and reconcile before rollback.'
            echo "Live image: $live_ref"
            exit 1
          }
          echo 'Verified current PROD image matches release manifest.'

      - name: Redeploy the older approved image (rollback)
        id: trigger
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          IMAGE: ${{ steps.approved.outputs.image }}
        run: |
          set -euo pipefail
          jq -n --arg image "$IMAGE" '{imageUrl: $image}' > payload.json
          curl --fail-with-body --silent --show-error --request POST \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
            --data @payload.json "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" > deploy.json
          id="$(jq -r '.id // empty' deploy.json)"
          [[ "$id" =~ ^dep-[A-Za-z0-9]+$ ]] || { echo 'Invalid Render deploy id'; exit 1; }
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
          echo "Rollback deployment started: $id"

      - name: Check exact rollback image is live
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
          IMAGE: ${{ steps.approved.outputs.image }}
        run: |
          set -euo pipefail
          sha="${IMAGE##*@}"
          for attempt in $(seq 1 90); do
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" > state.json
            status="$(jq -r '.status' state.json)"
            echo "Rollback deployment status ($attempt): $status"
            if [[ "$status" == 'live' ]]; then
              ref="$(jq -r '.image.ref // empty' state.json)"
              actual="$(jq -r '.image.sha // empty' state.json)"
              [[ "$ref" == "$IMAGE" || "$actual" == "$sha" ]] || { echo 'Wrong rollback image!'; exit 1; }
              echo 'Verified exact older approved image is live.'
              exit 0
            fi
            if [[ "$status" == 'build_failed' || "$status" == 'update_failed' || "$status" == 'pre_deploy_failed' || "$status" == 'canceled' || "$status" == 'deactivated' ]]; then
              echo "Rollback failed: $status"; exit 1
            fi
            sleep 10
          done
          echo 'Timeout waiting for rollback'; exit 1

      - name: Smoke test restored PROD API and document follow-up
        shell: bash
        env:
          VERSION: ${{ steps.approved.outputs.version }}
          IMAGE: ${{ steps.approved.outputs.image }}
        run: |
          set -euo pipefail
          url='https://advanced-regression-mlops-prod.onrender.com'
          curl --fail --silent --show-error --retry 15 --retry-delay 10 --retry-all-errors --max-time 30 "$url/health" \
            | jq -e '.status == "ok" and .environment == "prod"'
          curl --fail --silent --show-error "$url/model-info" \
            | jq -e --arg v "$VERSION" '.model_version == $v and (.features | length) == 12'
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            --data '{"CRIM":0.00632,"ZN":18,"INDUS":2.31,"CHAS":0,"NOX":0.538,"RM":6.575,"AGE":65.2,"DIS":4.09,"RAD":1,"TAX":296,"PTRATIO":15.3,"LSTAT":4.98}' \
            "$url/predict" \
            | jq -e '.environment == "prod" and (.predicted_value_thousands_usd | type) == "number"'
          echo '### PROD rollback verified' >> "$GITHUB_STEP_SUMMARY"
          echo "- Restored immutable image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo '**Required follow-up:** archive the superseded PROD manifest and update `releases/prod.json` to match the newly restored image and rollback workflow run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'ROLLBACK VERIFIED. Update the PROD release manifest through a PR.'
