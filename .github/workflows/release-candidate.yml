name: Release Candidate - Verified Docker

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: 'Publish this smoke-tested image to GitHub Container Registry'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev,tracking]'

      - name: Quality gates
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q

      - name: Fetch training dataset and verify DVC fingerprint before training
        run: |
          python -m advanced_regression_mlops.data
          python -c 'from advanced_regression_mlops.config import DATA_PATH; from advanced_regression_mlops.release_provenance import DVC_DATA_PATH, verified_dataset; print(verified_dataset(DATA_PATH, DVC_DATA_PATH))'

      - name: Train candidate model ONCE and record its fingerprint
        run: |
          python -m advanced_regression_mlops.train --n-iter 6
          python -m advanced_regression_mlops.release_quality
          sha256sum artifacts/model.joblib > artifacts/model.sha256
          sha256sum --check artifacts/model.sha256
          python -m pip freeze --exclude-editable > artifacts/runtime-constraints.txt
          test -s artifacts/runtime-constraints.txt

      - name: Record verifiable CI release lineage in MLflow
        run: python -m advanced_regression_mlops.release_provenance

      - name: Build image WITHOUT retraining
        run: docker build --file Dockerfile.release --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag advanced-regression-mlops:release-candidate .

      - name: Smoke test container API
        run: |
          docker run --detach --name mlops-release --publish 127.0.0.1:8000:8000 advanced-regression-mlops:release-candidate
          echo "Waiting for FastAPI to become ready..."
          healthy=0

          for attempt in $(seq 1 40); do
            if curl --max-time 4 --fail --silent http://127.0.0.1:8000/health -o health.json; then
              healthy=1
              echo "API ready on attempt $attempt"
              break
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' mlops-release)" != "true" ]; then
              echo "Container exited before becoming ready"
              docker logs mlops-release
              exit 1
            fi

            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "API did not become ready"
            docker ps -a
            docker logs mlops-release
            exit 1
          fi
          python -c 'import json; d=json.load(open("health.json")); assert d["status"] == "ok", d; print("Health:", d)'
          curl --fail --silent --show-error http://127.0.0.1:8000/model-info > model-info.json
          python -c 'import json; d=json.load(open("model-info.json")); assert d["model_version"] == "v0.1.0", d; print("Model:", d["model_version"])'
          curl --fail --silent --show-error --header 'Content-Type: application/json' --data '{"CRIM":0.00632,"ZN":18.0,"INDUS":2.31,"CHAS":0,"NOX":0.538,"RM":6.575,"AGE":65.2,"DIS":4.09,"RAD":1.0,"TAX":296.0,"PTRATIO":15.3,"LSTAT":4.98}' http://127.0.0.1:8000/predict > prediction.json
          python -c 'import json; d=json.load(open("prediction.json")); assert isinstance(d.get("predicted_value_thousands_usd"), (float,int)), d; print("Prediction:", d)'
          # Verify that the tested image contains the exact CI provenance and constraints.
          docker cp mlops-release:/app/artifacts/release-provenance.json image-provenance.json
          docker cp mlops-release:/app/artifacts/runtime-constraints.txt image-constraints.txt
          cmp reports/release-provenance.json image-provenance.json
          cmp artifacts/runtime-constraints.txt image-constraints.txt
          test "$(docker image inspect advanced-regression-mlops:release-candidate --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker exec mlops-release python -c 'import json; import importlib.metadata as m; r=json.load(open("/app/artifacts/release-provenance.json")); assert all(m.version(p) == r["runtime_versions"][p] for p in ("scikit-learn", "pandas", "numpy")); print("Training and serving dependency versions match")'
          # Security headers and structured logs must work INSIDE the image.
          curl --fail --silent --show-error --dump-header smoke-headers.txt --output /dev/null http://127.0.0.1:8000/health
          grep -qi '^x-content-type-options: nosniff' smoke-headers.txt
          grep -qi '^cache-control: no-store' smoke-headers.txt
          grep -qi '^x-request-id:' smoke-headers.txt
          docker logs mlops-release 2>&1 | grep -F '"event":"http_request"'
          echo 'Final image acceptance passed: provenance, versions, headers and logs.'

      - name: Preserve candidate model and evaluation (7 days)
        uses: actions/upload-artifact@v6
        with:
          name: regression-candidate-${{ github.sha }}
          path: |
            artifacts/model.joblib
            artifacts/model.sha256
            artifacts/runtime-constraints.txt
            reports/metrics.json
            reports/release-provenance.json
            mlflow-ci.db
            mlruns/
          if-no-files-found: error
          retention-days: 7

      - name: Sign in to GitHub Container Registry (opt-in)
        if: ${{ inputs.publish_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish EXACT tested Docker image (opt-in)
        if: ${{ inputs.publish_image }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA:0:12}-run-${GITHUB_RUN_ID}"
          docker tag advanced-regression-mlops:release-candidate "$image"
          docker push "$image"
          docker image inspect "$image" --format='{{index .RepoDigests 0}}' > image-digest.txt
          grep -q '^ghcr.io/.*@sha256:' image-digest.txt
          echo "Image published: $image"
          echo "Immutable reference: $(cat image-digest.txt)"
          echo "### Verified container published to GHCR" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$(cat image-digest.txt)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep image digest with build artifacts
        if: ${{ inputs.publish_image }}
        uses: actions/upload-artifact@v6
        with:
          name: image-digest-${{ github.run_id }}
          path: image-digest.txt
          if-no-files-found: error
          retention-days: 7
      - name: Show container logs on failure
        if: failure()
        run: docker logs mlops-release || true
