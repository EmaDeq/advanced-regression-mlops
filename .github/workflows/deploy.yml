name: Deploy - Opt In
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Render environment to deploy; requires your configured secret'
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  quality-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - name: Trigger manually configured Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo 'Missing environment secret RENDER_DEPLOY_HOOK_URL; nothing deployed.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
