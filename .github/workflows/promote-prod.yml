name: Promote DEV-verified image to PROD

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PROMOTE to deploy the approved DEV image to PROD'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: render-prod-operations
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PROMOTE'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: prod
      url: https://advanced-regression-mlops-prod.onrender.com
    steps:
      - name: Checkout approved manifest
        uses: actions/checkout@v5

      - name: Verify DEV-tested image and successful release
        id: approved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$(jq -r '.image' releases/dev.json)"
          release_run="$(jq -r '.release_run_id' releases/dev.json)"
          dev_run="$(jq -r '.deployment_run_id' releases/dev.json)"
          model_version="$(jq -r '.model_version' releases/dev.json)"
          [[ "$image" =~ ^ghcr\.io/emadeq/advanced-regression-mlops@sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$release_run" =~ ^[0-9]+$ && "$dev_run" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_run" \
            | jq -e '.conclusion == "success" and .name == "Release Candidate - Verified Docker" and .head_branch == "main"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$dev_run" \
            | jq -e '.conclusion == "success" and .name == "Deploy DEV - Verified GHCR Digest" and .head_branch == "main"'
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "model_version=$model_version" >> "$GITHUB_OUTPUT"
          echo "Promoting approved image: $image"

      - name: Trigger exact image deployment on existing Free PROD service
        id: trigger
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          IMAGE: ${{ steps.approved.outputs.image }}
        run: |
          set -euo pipefail
          [[ -n "$RENDER_API_KEY" ]] || { echo 'Missing PROD Render API key'; exit 1; }
          [[ "$RENDER_SERVICE_ID" =~ ^srv-[A-Za-z0-9]+$ ]] || exit 1
          base="https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $RENDER_API_KEY" "$base" > service.json
          jq -e '.name == "advanced-regression-mlops-prod"' service.json
          jq -n --arg ref "$IMAGE" '{imageUrl: $ref}' > payload.json
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' --data @payload.json \
            "$base/deploys" > deploy.json
          id="$(jq -r '.id // empty' deploy.json)"
          [[ "$id" =~ ^dep-[A-Za-z0-9]+$ ]] || { cat deploy.json; exit 1; }
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"
          echo "PROD deployment ID: $id"

      - name: Verify PROD deployment reaches live with exact digest
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
          IMAGE: ${{ steps.approved.outputs.image }}
        run: |
          set -euo pipefail
          sha="${IMAGE##*@}"
          for attempt in $(seq 1 90); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" > state.json
            status="$(jq -r '.status' state.json)"
            echo "PROD deploy status ($attempt): $status"
            if [[ "$status" == 'live' ]]; then
              ref="$(jq -r '.image.ref // empty' state.json)"
              actual="$(jq -r '.image.sha // empty' state.json)"
              if [[ "$ref" != "$IMAGE" && "$actual" != "$sha" ]]; then
                echo "Unexpected production image: ref=$ref sha=$actual"; exit 1
              fi
              echo "### PROD deployment verified" >> "$GITHUB_STEP_SUMMARY"
              echo "Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
              echo "Render deployment: \`$DEPLOY_ID\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" == 'build_failed' || "$status" == 'update_failed' || "$status" == 'pre_deploy_failed' || "$status" == 'canceled' || "$status" == 'deactivated' ]]; then
              echo "PROD deployment failed: $status"; exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for PROD'; exit 1

      - name: Smoke test live PROD prediction API
        shell: bash
        env:
          MODEL_VERSION: ${{ steps.approved.outputs.model_version }}
        run: |
          set -euo pipefail
          url='https://advanced-regression-mlops-prod.onrender.com'
          curl --fail --silent --show-error --retry 15 --retry-delay 10 --retry-all-errors --max-time 30 "$url/health" \
            | jq -e '.status == "ok" and .environment == "prod"'
          curl --fail --silent --show-error "$url/model-info" \
            | jq -e --arg v "$MODEL_VERSION" '.model_version == $v and (.features | length) == 12'
          curl --fail --silent --show-error --header 'Content-Type: application/json' \
            --data '{"CRIM":0.00632,"ZN":18,"INDUS":2.31,"CHAS":0,"NOX":0.538,"RM":6.575,"AGE":65.2,"DIS":4.09,"RAD":1,"TAX":296,"PTRATIO":15.3,"LSTAT":4.98}' \
            "$url/predict" \
            | jq -e '.environment == "prod" and (.predicted_value_thousands_usd | type) == "number"'
          echo 'PROD inference checks passed.'
