name: Deploy DEV - Verified GHCR Digest

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Successful release-candidate workflow run ID that published a GHCR image'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: render-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: dev
      url: https://advanced-regression-mlops-dev.onrender.com
    steps:
      - name: Select a successfully published release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid workflow run ID'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > release.json
          jq -e '.conclusion == "success" and .name == "Release Candidate - Verified Docker" and .head_branch == "main"' release.json
          mkdir -p release
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "image-digest-$RELEASE_RUN_ID" --dir release
          image="$(tr -d '\r\n' < release/image-digest.txt)"
          [[ "$image" =~ ^ghcr\.io/emadeq/advanced-regression-mlops@sha256:[a-f0-9]{64}$ ]] || {
            echo 'Unexpected image reference: expected approved GHCR repository and a SHA256 digest'
            exit 1
          }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Selected tested image: $image"

      - name: Trigger DEV deploy of that exact image
        id: trigger
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          [[ -n "$RENDER_API_KEY" ]] || { echo 'Missing dev RENDER_API_KEY secret'; exit 1; }
          [[ "$RENDER_SERVICE_ID" =~ ^srv-[a-zA-Z0-9]+$ ]] || { echo 'Missing or invalid dev RENDER_SERVICE_ID'; exit 1; }
          base="https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $RENDER_API_KEY" "$base" > service.json
          jq -e '.name == "advanced-regression-mlops-dev"' service.json
          jq -n --arg image "$IMAGE" '{imageUrl: $image}' > deploy-payload.json
          curl --fail-with-body --silent --show-error \
            --request POST --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data @deploy-payload.json "$base/deploys" > deploy.json
          deploy_id="$(jq -r '.id // empty' deploy.json)"
          [[ "$deploy_id" =~ ^dep-[a-zA-Z0-9]+$ ]] || { echo 'Render did not return a deployment ID'; cat deploy.json; exit 1; }
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Deployment requested: $deploy_id"

      - name: Wait for deploy and verify image digest
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          expected_sha="${IMAGE##*@}"
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" > current-deploy.json
            status="$(jq -r '.status' current-deploy.json)"
            echo "Render deployment status ($attempt): $status"
            if [[ "$status" == 'live' ]]; then
              reported_ref="$(jq -r '.image.ref // empty' current-deploy.json)"
              reported_sha="$(jq -r '.image.sha // empty' current-deploy.json)"
              if [[ "$reported_ref" != "$IMAGE" && "$reported_sha" != "$expected_sha" ]]; then
                echo "Wrong image reported by Render: ref=$reported_ref sha=$reported_sha"
                exit 1
              fi
              echo "Render reports the verified image live: $IMAGE"
              echo "### DEV deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
              echo "- Release image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- Render deployment ID: \`$DEPLOY_ID\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" == 'build_failed' || "$status" == 'update_failed' || "$status" == 'pre_deploy_failed' || "$status" == 'canceled' || "$status" == 'deactivated' ]]; then
              echo "Render deployment failed: $status"
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for Render deployment'
          exit 1

      - name: Smoke test the live DEV API
        shell: bash
        run: |
          set -euo pipefail
          url='https://advanced-regression-mlops-dev.onrender.com'
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --max-time 25 "$url/health" \
            | jq -e '.status == "ok" and .environment == "dev"'
          curl --fail --silent --show-error "$url/model-info" \
            | jq -e '.model_version == "v0.1.0" and (.features | length) == 12'
          curl --fail --silent --show-error --header 'Content-Type: application/json' \
            --data '{"CRIM":0.00632,"ZN":18,"INDUS":2.31,"CHAS":0,"NOX":0.538,"RM":6.575,"AGE":65.2,"DIS":4.09,"RAD":1,"TAX":296,"PTRATIO":15.3,"LSTAT":4.98}' \
            "$url/predict" \
            | jq -e '.environment == "dev" and (.predicted_value_thousands_usd | type) == "number"'
          echo 'DEV cloud API verified.'
